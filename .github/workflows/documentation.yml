name: LoxiLB-Docs
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tagName:
        description: 'Tag Name'
        required: true
        default: 'latest'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('docs/requirements.txt') }}
      - name: Install dependencies
        run: pip install -r docs/requirements.txt
      - name: Build strict
        run: mkdocs build --strict
      - name: Install vale
        run: |
          wget -qO- https://github.com/errata-ai/vale/releases/latest/download/vale_Linux_64-bit.tar.gz | tar xz -C /usr/local/bin vale
        continue-on-error: true
      - name: Prose lint (vale)
        run: vale docs/getting-started/ docs/concepts/ || true
        # NOTE: continue-on-error for Phase 1 — tighten in Phase 5
      - name: Install lychee
        run: |
          wget -qO- https://github.com/lycheeverse/lychee/releases/latest/download/lychee-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /usr/local/bin lychee
        continue-on-error: true
      - name: Broken link check (lychee)
        run: lychee docs/ --offline || true
        # NOTE: continue-on-error for Phase 1 — tighten in Phase 5

  deploy:
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r docs/requirements.txt
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
      - name: Deploy latest
        if: github.event.inputs.tagName == ''
        run: |
          mike deploy --update-aliases main latest --allow-empty
          mike set-default latest --push --allow-empty
      - name: Deploy tagged version
        if: github.event.inputs.tagName != ''
        run: mike deploy --push ${{ github.event.inputs.tagName }} --allow-empty
