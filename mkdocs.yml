site_name: LoxiLB
site_url: https://loxilb-io.github.io/loxilbdocs
repo_name: loxilb-io/loxilb
repo_url: https://github.com/loxilb-io/loxilb
theme:
    name: material
    custom_dir: overrides
    logo: photos/loxilb-logo.png
    favicon: photos/loxilb-logo.png
    features:
        - navigation.path
        - navigation.instant
        - navigation.tracking
        - navigation.indexes
        - navigation.top
        - navigation.footer
        - search.suggest
        - navigation.tabs
        - navigation.tabs.sticky
        - navigation.sections
        - navigation.expand
        - search.highlight
        - content.code.copy
        - content.code.annotate
        - content.tabs.link
    analytics:
        gtag: G-21G7NBL2BN
    icon:
        repo: fontawesome/brands/github
    palette:
        - scheme: default
          media: "(prefers-color-scheme: light)"
          primary: indigo
          toggle:
              icon: material/weather-night
              name: Switch to dark mode
        - scheme: slate
          media: "(prefers-color-scheme: dark)"
          primary: black
          toggle:
             icon: material/weather-sunny
             name: Switch to light mode
nav:
  - Home: index.md
  - Concepts:
      - Unified Gateway Platform: concepts/unified-gateway.md
      - Architecture: concepts/architecture.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Migrating from Community: getting-started/migration-from-community.md
  - AI Gateway:
      - Overview: ai-gateway/overview.md
      - LLM Routing: ai-gateway/llm-routing.md
      - KV Caching: ai-gateway/kv-caching.md
      - vLLM Integration: ai-gateway/vllm-integration.md
      - Model Load Balancing: ai-gateway/model-load-balancing.md
      - PD Disaggregation: ai-gateway/pd-disaggregation.md
      - AWS KV Cache Deployment: ai-gateway/aws-kv-cache.md
      - API Key Management: ai-gateway/api-key-management.md
      - SSE Quota Management: ai-gateway/sse-quota-management.md
      - Configuration Reference: ai-gateway/configuration-reference.md
  - Security Gateway:
      - Overview: security-gateway/overview.md
      - OPA Policy Enforcement: security-gateway/opa-policy-enforcement.md
      - PII Detection with Presidio: security-gateway/presidio-pii-detection.md
      - LlamaFirewall: security-gateway/llamafirewall.md
      - Rate Limiting: security-gateway/rate-limiting.md
      - Secure Dataplane Overview: security-gateway/secure-dataplane.md
      - IPsec: security-gateway/ipsec.md
      - mTLS: security-gateway/mtls.md
      - Deployment Scenarios: security-gateway/deployment-scenarios.md
      - SYN Flood Protection: security-gateway/syn-flood.md
      - IP Filtering: security-gateway/ip-filtering.md
      - Configuration Reference: security-gateway/configuration-reference.md
  - Network Gateway:
      - Overview: network-gateway/overview.md
      - Egress Load Balancing: network-gateway/egress-lb.md
      - Direct Server Return: network-gateway/dsr.md
      - NAT64: network-gateway/nat64.md
      - HTTPS Proxy Modes: network-gateway/https-proxy.md
      - HTTP/2 Proxy: network-gateway/http2-proxy.md
      - SCTP Multi-homing: network-gateway/sctp-multihoming.md
  - Operations:
      - User Management: operations/user-management.md
      - Monitoring Setup: operations/monitoring.md
  - Deployment Guides:
      - EKS External Mode: eks-external.md
      - EKS In-Cluster: eks-incluster.md
      - K3s with Flannel: k3s_quick_start_flannel.md
      - K3s with Calico: k3s_quick_start_calico.md
      - K3s with Cilium: quick_start_with_cilium.md
      - K8s In-Cluster: k8s-flannel-incluster.md
      - Multi-AZ HA on AWS: aws-multi-az.md
      - Multi-Cloud HA: multi-cloud-ha.md
      - RedHat OCP: rhocp-quickstart-incluster.md
      - Standalone Mode: standalone.md
  - Reference:
      - API Reference: reference/api.md
      - CLI Reference: reference/cli.md
      - System Requirements: reference/system-requirements.md
  - Community:
      - Contributing: community/contributing.md
      - Roadmap: community/roadmap.md
      - FAQ: community/faq.md

copyright: Copyright &copy; 2022 - 2024 LoxiLB Authors

extra:
    version:
        provider: mike
        default: latest
        alias: true
    homepage: https://www.loxilb.io/
    generator: false
    social:
        - icon: fontawesome/brands/github
          link: https://github.com/loxilb-io/loxilb
          name: GitHub
        - icon: fontawesome/brands/linkedin
          link: https://www.linkedin.com/company/loxilb/
          name: LinkedIn
        - icon: material/web
          link: https://www.loxilb.io/
          name: Website
        - icon: fontawesome/brands/slack
          link: https://join.slack.com/t/loxilb/shared_invite/zt-2b3xx14wg-P7WHj5C~OEON_jviF0ghcQ
extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - pymdownx.snippets:
      check_paths: true
  - def_list
  - tables
  - attr_list
  - md_in_html
  - toc:
      title: On this page
      permalink: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - footnotes
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: en
  - autorefs
  - tags
