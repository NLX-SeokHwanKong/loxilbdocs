copyright: Copyright &copy; 2022 - 2024 LoxiLB Authors

extra:
    version:
        provider: mike
        default: latest
        alias: true
    homepage: https://www.loxilb.io/
    generator: false
    social:
        - icon: fontawesome/brands/github
          link: https://github.com/loxilb-io/loxilb
          name: GitHub
        - icon: fontawesome/brands/linkedin
          link: https://www.linkedin.com/company/loxilb/
          name: LinkedIn
        - icon: material/web
          link: https://www.loxilb.io/
          name: Website
        - icon: fontawesome/brands/slack
          link: https://join.slack.com/t/loxilb/shared_invite/zt-2b3xx14wg-P7WHj5C~OEON_jviF0ghcQ
extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - pymdownx.snippets:
      check_paths: true
  - def_list
  - tables
  - attr_list
  - md_in_html
  - toc:
      title: On this page
      permalink: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - footnotes
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: en
  - autorefs
  - tags
